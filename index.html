<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Workout tracker and food diary with macro targets.">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1015" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tally">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Tally Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
/* Layout: single phone column, sticky title row, fixed bottom tab bar, bottom sheets for pickers.
   Macro colours follow calibrated Olympic plates: red 25 kg = protein, blue 20 kg = carbs, yellow 15 kg = fat, green 10 kg = fibre. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#E4E8EE; --line:#D6DCE4; --ink:#121821; --muted:#5A6576;
  --btn:#121821; --btn-ink:#FFFFFF; --accent:#C8323A; --accent-ink:#FFFFFF;
  --pro:#D9434A; --carb:#2563D9; --fat:#C99100; --fib:#2A8F55;
  --good:#2A8F55; --warn:#B7701A; --bad:#C8323A;
  --shadow:0 10px 30px rgba(18,24,33,.18);
  /* Bottom bar: one colour in both themes so it always matches the phone's own navigation strip */
  --nav-bg:#161A21; --nav-line:#2A303B; --nav-muted:#97A1B1; --nav-on:#FFFFFF; --nav-accent:#EF545C;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --surface:#161A21; --sunk:#1F242D; --line:#2A303B; --ink:#E9EDF3; --muted:#909AAA;
  --btn:#E9EDF3; --btn-ink:#0D1015; --accent:#EF545C; --accent-ink:#0D1015;
  --pro:#F06A70; --carb:#6593F5; --fat:#EDC03A; --fib:#4FC17E;
  --good:#4FC17E; --warn:#E2A04A; --bad:#EF545C; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#161A21; --sunk:#1F242D; --line:#2A303B; --ink:#E9EDF3; --muted:#909AAA;
  --btn:#E9EDF3; --btn-ink:#0D1015; --accent:#EF545C; --accent-ink:#0D1015;
  --pro:#F06A70; --carb:#6593F5; --fat:#EDC03A; --fib:#4FC17E;
  --good:#4FC17E; --warn:#E2A04A; --bad:#EF545C; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--carb);outline-offset:2px}
#app{overflow-x:clip;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
h2{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
h3{font-size:17px;font-weight:600;margin:0;line-height:1.25}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-top:20px;margin-bottom:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:10px;font-weight:600;background:var(--sunk);color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.go{background:var(--accent);color:var(--accent-ink)}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.btn.danger{color:var(--bad);background:transparent;border:1px solid var(--line)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.link{color:var(--carb);font-weight:600;font-size:14px;padding:6px 2px}
.icon-btn{width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);background:var(--sunk)}
.icon-btn svg{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.pill.cloud i{background:var(--good)} .pill.error i{background:var(--bad)} .pill.syncing i{background:var(--warn)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--muted)}
.chip.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.tag{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:2px 7px;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.inp{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;width:100%;min-width:0}
.inp:focus{border-color:var(--carb);outline:none}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.empty h3{color:var(--ink);margin-bottom:6px}

/* Workouts list */
.wk-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.wk-ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wk-foot{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--btn);color:var(--btn-ink);border-radius:14px;padding:14px}
.resume .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* Editor */
.ed-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ed-row:first-child{border-top:0}
.ed-ctrls{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ed-ctrls .inp{height:36px;font-size:15px;padding:0 8px;text-align:center}
.ed-ctrls .sets{width:56px}.ed-ctrls .reps{width:84px}
.ed-ctrls small{color:var(--muted);font-size:12px}
.ed-side{display:flex;flex-direction:column;gap:6px}

/* Session */
.sess-h{display:flex;align-items:center;gap:10px}
.timer{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.set-grid{display:grid;grid-template-columns:30px minmax(0,1fr) 74px 64px 44px;gap:8px;align-items:center}
.set-head{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:10px;padding:0 4px}
.set-row{padding:4px;border-radius:10px;margin-top:4px}
.set-row.lr{grid-template-rows:auto auto;row-gap:6px}
.set-row.lr .set-n,.set-row.lr .tick{grid-row:span 2;align-self:stretch;height:auto}
.set-row.lr .set-n{display:flex;align-items:center;justify-content:center}
.side{display:inline-block;min-width:14px;font-weight:700;color:var(--ink);margin-right:4px}
.lrbtn{height:36px;padding:0 10px;border-radius:9px;background:var(--sunk);color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.02em;margin-right:6px;white-space:nowrap}
.lrbtn[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.set-row.done{background:color-mix(in srgb,var(--good) 14%,transparent)}
.set-n{font-family:var(--f-display);font-size:18px;font-weight:600;text-align:center;color:var(--muted)}
.set-prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-in{height:40px;border-radius:9px;border:1px solid transparent;background:var(--sunk);text-align:center;font-size:16px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.set-in:focus{border-color:var(--carb);outline:none;background:var(--surface)}
.set-in.bad{border-color:var(--bad)}
.tick{width:44px;height:40px;border-radius:9px;background:var(--sunk);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tick svg{width:20px;height:20px}
.set-row.done .tick{background:var(--good);color:#fff}
.ex-foot{display:flex;gap:8px;margin-top:10px}
#rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:30;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.rest-in{max-width:528px;margin:0 auto;background:var(--btn);color:var(--btn-ink);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.rest-in b{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;min-width:62px}
.rest-in button{height:34px;padding:0 10px;border-radius:8px;background:color-mix(in srgb,var(--btn-ink) 16%,transparent);color:var(--btn-ink);font-weight:600;font-size:14px}
.rest-bar{flex:1;height:4px;border-radius:2px;background:color-mix(in srgb,var(--btn-ink) 20%,transparent);overflow:hidden}
.rest-bar i{display:block;height:100%;background:var(--accent)}

/* Diary */
.daynav{display:flex;align-items:center;gap:8px}
.daynav .lbl{flex:1;text-align:center;font-weight:600}
.kcal-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big{font-family:var(--f-display);font-weight:700;font-size:48px;line-height:.95;font-variant-numeric:tabular-nums}
.big small{font-size:20px;font-weight:600;color:var(--muted);margin-left:4px}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.macros{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:16px}
.mac .row{justify-content:space-between;margin-bottom:6px;font-size:13px}
.mac .row b{font-weight:600}
.mac .row span{color:var(--muted)}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:0}
.ins{display:flex;flex-direction:column;gap:8px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.ins div{display:flex;gap:10px;font-size:14px;align-items:flex-start}
.ins i{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;background:var(--muted)}
.ins .good i{background:var(--good)} .ins .warn i{background:var(--warn)} .ins .bad i{background:var(--bad)}
.meal-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.meal-h span{font-size:13px;color:var(--muted)}
.entry{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.entry .grow b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .grow small{color:var(--muted);font-size:13px}
.entry .k{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Lists in sheets */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 2px;border-bottom:1px solid var(--line)}
.li .grow b{display:block;font-weight:500}
.li .grow small{color:var(--muted);font-size:13px}
.li.added .plus{background:var(--good);color:#fff}
.plus{width:30px;height:30px;border-radius:8px;background:var(--sunk);display:flex;align-items:center;justify-content:center;flex:none;font-size:18px;font-weight:600;color:var(--muted)}
.li-note{font-size:12px;color:var(--muted);padding:10px 2px}

/* Plan */
.goal{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.goal.on{border:2px solid var(--btn);padding:13px}
.goal .gk{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.goal .gk small{font-size:16px;color:var(--muted);font-weight:600;margin-left:3px}
.mrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:14px;font-variant-numeric:tabular-nums}
.mrow b{font-weight:600}
.radio{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.radio .o{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px}
.radio.on{border-color:var(--btn)}
.radio.on .o{border:5px solid var(--btn)}
.radio small{display:block;color:var(--muted);font-size:13px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.foot{font-size:13px;color:var(--muted);line-height:1.5}

/* History */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.sess-sets{margin-top:10px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.sess-sets div{display:flex;justify-content:space-between;gap:10px}
.sess-sets span{color:var(--muted);text-align:right}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:5px;padding:2px 6px}


/* Nutrition overview */
.stp{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.stp i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.stp.good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}.stp.good i{background:var(--good)}
.stp.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}.stp.warn i{background:var(--warn)}
.stp.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}.stp.bad i{background:var(--bad)}
.hits{display:inline-flex;gap:8px;font-size:12px;font-weight:600;align-items:center}
.hits span{display:inline-flex;align-items:center;gap:4px}
.hits i{width:7px;height:7px;border-radius:2px}
.hits .ok{color:var(--ink)}.hits .miss{color:var(--muted);opacity:.7}
.nrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line);color:var(--muted)}
.nrow:first-child{border-top:0}
.nrow b{font-weight:600;color:var(--ink)}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:14px}
.sc{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.sb{position:relative;width:100%;height:64px;background:var(--sunk);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
.sb i{display:block;width:100%;background:var(--line);border-radius:5px 5px 0 0}
.sb i.good{background:var(--good)}.sb i.warn{background:var(--warn)}.sb i.bad{background:var(--bad)}
.sb .tl{position:absolute;left:0;right:0;bottom:66.6%;height:2px;background:var(--ink);opacity:.55;z-index:1}
.sd{font-size:11px;color:var(--muted);font-weight:600}
.sw2{height:6px;display:flex;align-items:center}.sw2 i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.legend i.good{background:var(--good)}.legend i.warn{background:var(--warn)}.legend i.bad{background:var(--bad)}.legend i.wd{background:var(--accent);border-radius:50%}
.meal-acts{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:4px}
.rv{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rv:first-child{border-top:0}
.rv b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv small{display:block;color:var(--muted);font-size:13px}
.rv .rvg{width:72px;flex:none}
.ck{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--good);color:#fff;border:1px solid var(--good)}
.ck svg{width:16px;height:16px}
.rv.off .ck{background:var(--surface);color:transparent;border-color:var(--line)}
.rv.off .grow,.rv.off .rvg{opacity:.45}
.li small.ell,.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scanbox{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox i{position:absolute;left:10%;right:10%;top:34%;bottom:34%;border:2px solid #fff;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.btn svg{flex:none}
/* Nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--nav-bg);border-top:1px solid var(--nav-line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:64px}
#nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;letter-spacing:.03em;position:relative;color:var(--nav-muted)}
#nav svg{width:24px;height:24px}
#nav button.on{color:var(--nav-on)}

    plans[g]={kcal,p:pro,c:carb,f:fat,fib:Math.round(kcal/1000*14),wk:(kcal-tdee)*7/7700};
  }
  return {bmr,tdee,bmi,plans};
}
function day(k){return S.days[k]||{food:[],sessions:[]};}
function ensureDay(k){if(!S.days[k])S.days[k]={food:[],sessions:[]};S.days[k].food=S.days[k].food||[];S.days[k].sessions=S.days[k].sessions||[];return S.days[k];}
function entryMac(e){const m=e.g/100;return {kcal:e.per.kcal*m,p:e.per.p*m,c:e.per.c*m,f:e.per.f*m,fib:(e.per.fib||0)*m};}
function totals(list){const t={kcal:0,p:0,c:0,f:0,fib:0};for(const e of list){const m=entryMac(e);for(const k in t)t[k]+=m[k];}return t;}
function allFoods(){return (S.customFoods||[]).concat(FOODS);}
function foodById(id){return allFoods().find(f=>f.id===id);}

/* Search: every query word must appear; word-start matches rank higher. */
const SYN={groin:'adductors',adductor:'adductors',obliques:'oblique',hipflexor:'hip flexors',plyo:'plyometrics',stretch:'stretch',stretching:'stretch',toast:'bread',rasher:'bacon',rashers:'bacon',spuds:'potato',spud:'potato',scallion:'spring onion',eggplant:'aubergine',bap:'roll',buns:'bun',brekkie:'breakfast',soda:'soda',crisp:'crisps',chipper:'chip shop',takeaway:'fast food',choc:'chocolate',pud:'pudding',ohp:'overhead press',rdl:'romanian',db:'dumbbell',bb:'barbell',kb:'kettlebell',pullup:'pull up',pullups:'pull up',pushup:'push up',pushups:'push up',chinup:'chin up',chinups:'chin up',situp:'sit up',situps:'sit up',lats:'lat',tri:'tricep',tris:'tricep',bi:'curl',bis:'curl',delts:'raise',ab:'crunch',abs:'crunch',zucchini:'courgette',shrimp:'prawns',fries:'chips',chips:'chips',yoghurt:'yogurt',mince:'mince',ground:'mince',hamburger:'mince',jogging:'running',run:'running',bike:'bike',rowing:'rowing',treadmill:'treadmill',bench:'bench',smith:'smith'};
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function qTokens(q){const out=[];for(const t of norm(q).split(' ').filter(Boolean)){const s=SYN[t];if(s)out.push(...s.split(' '));else out.push(t);}return out;}
function score(name,toks){
  if(!toks.length)return 1;
  const n=norm(name),words=n.split(' ');let sc=0;
  for(let t of toks){
    if(!n.includes(t)){if(t.length>3&&t.endsWith('s')&&n.includes(t.slice(0,-1)))t=t.slice(0,-1);else if(t.length>4&&t.endsWith('es')&&n.includes(t.slice(0,-2)))t=t.slice(0,-2);else return 0;}
    sc+=words.includes(t)?4:words.some(w=>w.startsWith(t))?3:1;
  }
  return sc;
}

function amtText(e){return e.mode==='s'&&e.sl?`${fmt(e.amt,2)} × ${e.sl} (${fmt(e.g,0)} g)`:`${fmt(e.g,0)} g`;}
function macBar(l,c,v,t){const pct=t?v/t:0;const over=c!=='pro'&&c!=='fib'&&pct>1.15;return `<div class="mac"><div class="row"><b><span class="sw" style="background:var(--${c})"></span>${l}</b><span class="num">${fmt(v,0)} / ${t} g</span></div><div class="bar"><i style="width:${Math.min(100,pct*100)}%;background:${over?'var(--bad)':'var(--'+c+')'}"></i></div></div>`;}
function insights(t,p,k){
  const isToday=k===todayKey(), past=k<todayKey(), out=[];
  if(!t.kcal)return [{t:'',m:isToday?'Nothing logged yet today. Add your first meal below.':'Nothing logged for this day.'}];
  const gk=p.goal||S.goal, pct=t.kcal/p.kcal, gl=GOALS[gk].l.toLowerCase();
  if(pct>1.08)out.push({t:'bad',m:`<b>${fint(t.kcal-p.kcal)} kcal over</b> your ${gl} target.${gk==='cut'?' Over the week this slows fat loss.':''}`});
  else if(pct>=0.92)out.push({t:'good',m:`<b>Calories are on target</b> for ${gl}.`});
  else out.push({t:past?'warn':'',m:past?`<b>${fint(p.kcal-t.kcal)} kcal under</b> your ${gl} target.${gk==='bulk'?' You need the surplus to gain.':''}`:`<b>${fint(p.kcal-t.kcal)} kcal</b> left to eat today.`});
  const pg=p.p-t.p;
  if(t.p>=p.p*0.95)out.push({t:'good',m:`<b>Protein target hit</b> (${fmt(t.p,0)} g).`});
  else{
    const sug=pg<=28?{id:'db:greek-yogurt-0-fat',g:Math.min(400,Math.ceil(pg/10.3*100/50)*50)}:{id:'db:chicken-breast-cooked-skinless',g:Math.min(400,Math.ceil(pg/31*100/10)*10)};
    const f=foodById(sug.id);
    out.push({t:'warn',m:`<b>Protein is ${fmt(pg,0)} g short.</b>${f?` ${sug.g} g of ${f.n.toLowerCase()} would add ${fmt(f.p*sug.g/100,0)} g.`:''}`});
  }
  if(t.fib<p.fib*0.8)out.push({t:past?'warn':'',m:`<b>Fibre is ${fmt(p.fib-t.fib,0)} g short.</b> Oats, beans, lentils, berries and vegetables are the easiest sources.`});
  if(t.f>p.f*1.2)out.push({t:'warn',m:`<b>Fat is ${fmt(t.f-p.f,0)} g over</b> (${fint((t.f-p.f)*9)} kcal). Oils, cheese and nuts add up fast.`});
  else if(past&&t.f<p.f*0.7)out.push({t:'warn',m:`<b>Fat is low</b> (${fmt(t.f,0)} of ${p.f} g). Some fat is needed for hormones and vitamin absorption.`});
  if(t.c>p.c*1.15)out.push({t:'warn',m:`<b>Carbs are ${fmt(t.c-p.c,0)} g over</b> target.`});
  else if(past&&t.c<p.c*0.75)out.push({t:'',m:`<b>Carbs were ${fmt(p.c-t.c,0)} g under.</b> Low carbs can leave training sessions feeling flat.`});
  return out;
}

        h+=`</div><div class="card" style="margin-top:12px;background:var(--bg)"><h2>Fuel for this session</h2>${foodLine(s.day,'Workout day')}${foodLine(addDays(s.day,-1),'Day before')}</div><div style="margin-top:12px"><button class="btn danger sm" data-act="delSess" data-id="${s.id}" data-day="${s.day}">Delete this workout</button></div>`;
      }

  if(ui.histEx)return h+vExDetail(ui.histEx)+`</div>`;
  const map={};
  for(const s of ss)for(const e of s.ex){const k=exInfo(e.n).k;const m=metric(k,e.sets);if(!map[e.n])map[e.n]={n:e.n,k,count:0,best:0,last:s.day};map[e.n].count++;if(m>map[e.n].best)map[e.n].best=m;}
  const arr=Object.values(map).sort((a,b)=>b.last.localeCompare(a.last)||b.count-a.count);
  h+=`<div class="card" style="padding-block:4px">`;
  for(const x of arr)h+=`<button class="li" data-act="histEx" data-n="${esc(x.n)}"><span class="grow"><b>${esc(x.n)}</b><small>${x.count} session${x.count>1?'s':''} · Last ${relDay(x.last)}</small></span><span class="num" style="text-align:right;font-weight:600">${metricText(x.k,x.best)}<br><small class="muted" style="font-weight:400">best</small></span></button>`;
  return h+`</div></div>`;
}
function vExDetail(n){
  const k=exInfo(n).k;const pts=[];
  for(const s of allSessions().slice().reverse()){const e=s.ex.find(x=>x.n===n);if(e)pts.push({day:s.day,v:metric(k,e.sets),sets:e.sets});}
  const best=Math.max(...pts.map(p=>p.v));
  let h=`<div class="row"><button class="icon-btn" data-act="histBack" aria-label="All exercises">${ICON.back}</button><h3 class="grow">${esc(n)}</h3></div>
  <div class="card"><div class="row between"><h2>${metricName(k)}</h2><span class="badge">Best ${metricText(k,best)}</span></div>${chart(pts.map(p=>({x:p.day,y:k==='w'?wDisp(p.v):k==='c'?dDisp(p.v):p.v})))}</div>
  <div class="card" style="padding-block:4px">`;
  for(const p of pts.slice().reverse())h+=`<div class="kv"><span>${dayLabel(p.day)}</span><span class="num" style="text-align:right">${p.sets.map(x=>esc(setText(k,x))).join('<br>')}</span></div>`;

}
function chart(pts){
  if(pts.length<2)return `<p class="muted" style="font-size:14px;padding:18px 0">Log this exercise in at least two workouts to see a trend.</p>`;
  const W=320,H=170,L=40,R=12,T=12,B=26;
  let lo=Math.min(...pts.map(p=>p.y)),hi=Math.max(...pts.map(p=>p.y));
  if(hi===lo){hi+=1;lo=Math.max(0,lo-1);}
  const span=hi-lo,step=niceStep(span/3);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const X=i=>L+(W-L-R)*(pts.length===1?0.5:i/(pts.length-1)),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='';for(let v=lo;v<=hi+1e-9;v+=step){const y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+3}" text-anchor="end">${fmt(v,1)}</text>`;}
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area=d+`L${X(pts.length-1).toFixed(1)},${Y(lo)}L${X(0).toFixed(1)},${Y(lo)}Z`;
  const last=pts.length-1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">${g}<path d="${area}" fill="var(--carb)" fill-opacity=".12"/><path d="${d}" fill="none" stroke="var(--carb)" stroke-width="2.2" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i===last?4.5:2.6}" fill="${i===last?'var(--accent)':'var(--carb)'}"/>`).join('')}<text x="${L}" y="${H-6}">${shortDate(pts[0].x)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${shortDate(pts[last].x)}</text></svg>`;
}
function niceStep(x){if(x<=0)return 1;const p=10**Math.floor(Math.log10(x));const f=x/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}

/* ---------- Nutrition overview ---------- */
function dayPlan(k){const d=S.days[k];if(d&&d.tg&&d.tg.kcal)return d.tg;const tg=targets();return tg?Object.assign({goal:S.goal},tg.plans[S.goal]):null;}
function dayStatus(k){
  const d=S.days[k],food=(d&&d.food)||[];
  if(!food.length)return {state:'none'};
  const t=totals(food),p=dayPlan(k);
  if(!p)return {state:'notarget',t};
  const r=t.kcal/p.kcal;
  return {state:r<0.9?'under':r>1.1?'over':'on',t,p,r,hit:{p:t.p>=p.p*0.9,c:t.c>=p.c*0.8&&t.c<=p.c*1.2,f:t.f>=p.f*0.7&&t.f<=p.f*1.2,fib:t.fib>=p.fib*0.8}};
}
const ST={on:['On target','good'],under:['Under','warn'],over:['Over','bad'],none:['Not logged',''],notarget:['No targets set','']};
function statusPill(st,prefix){const [l,c]=ST[st.state];return `<span class="stp ${c}"><i></i>${prefix||''}${st.state==='under'||st.state==='over'?`${l} by ${fint(Math.abs(st.t.kcal-st.p.kcal))} kcal`:l}</span>`;}
function hitChips(st){if(!st.hit)return '';return `<span class="hits">${[['p','P','pro'],['c','C','carb'],['f','F','fat'],['fib','Fib','fib']].map(([k,l,c])=>`<span class="${st.hit[k]?'ok':'miss'}" title="${st.hit[k]?'Hit':'Missed'}"><i style="background:var(--${c})"></i>${l} ${st.hit[k]?'✓':'✗'}</span>`).join('')}</span>`;}
function foodLine(k,label){

  return `<button class="nrow" data-act="openDiary" data-k="${k}"><span class="grow"><b>${label} · ${dayLabel(k)}</b>${det?'<br>'+det:''}<span style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${statusPill(st)}${hitChips(st)}</span></span>${ICON.fwd.replace('<svg','<svg width="18" height="18"')}</button>`;
}
function vNutrition(){
  const today=todayKey(),n=ui.nDays||14,days=[];
  for(let i=0;i<n;i++)days.push(addDays(today,-i));
  const wk=days.slice(0,7).map(k=>({k,st:dayStatus(k)})),logged=wk.filter(x=>x.st.t&&x.st.p);
  const sessDays=new Set(allSessions().map(s=>s.day));
  if(!targets()&&!Object.values(S.days).some(d=>d.food&&d.food.length))
    return `<div class="empty"><h3>No food logged yet</h3><p>Set your targets in Plan and log meals in the Diary. Each day's result shows up here next to your workouts.</p><div style="margin-top:14px"><button class="btn primary" data-act="tab" data-tab="diary">Open the diary</button></div></div>`;
  let h=`<div class="card"><div class="row between"><h2>Last 7 days</h2><span class="muted" style="font-size:13px">${logged.length} of 7 days logged</span></div>`;
  if(logged.length){
    const on=logged.filter(x=>x.st.state==='on').length,ph=logged.filter(x=>x.st.hit.p).length;
    const ak=logged.reduce((a,x)=>a+x.st.t.kcal,0)/logged.length,at=logged.reduce((a,x)=>a+x.st.p.kcal,0)/logged.length;
    const ap=logged.reduce((a,x)=>a+x.st.t.p,0)/logged.length,apt=logged.reduce((a,x)=>a+x.st.p.p,0)/logged.length;

  }
  // strip: oldest on the left

  h+=`<div class="strip" role="list">${strip.map(k=>{const st=dayStatus(k);const r=st.r!=null?Math.min(st.r,1.5):0;const c=ST[st.state][1];return `<button class="sc" role="listitem" data-act="openDiary" data-k="${k}" aria-label="${dayLabel(k)}: ${ST[st.state][0]}"><span class="sb"><span class="tl"></span><i class="${c}" style="height:${(r/1.5*100).toFixed(0)}%"></i></span><span class="sd">${parseKey(k).toLocaleDateString(undefined,{weekday:'narrow'})}</span><span class="sw2">${sessDays.has(k)?'<i></i>':''}</span></button>`;}).join('')}</div>
  <div class="legend"><span><i class="good"></i>On target</span><span><i class="warn"></i>Under</span><span><i class="bad"></i>Over</span><span><i class="wd"></i>Workout day</span><span>Line = calorie target</span></div></div>

  for(const k of days){
    const st=dayStatus(k),ws=allSessions().filter(s=>s.day===k).map(s=>s.name);
    h+=`<button class="nrow" data-act="openDiary" data-k="${k}"><span class="grow"><b>${dayLabel(k)}</b>${ws.length?` <span class="tag">${esc(ws.join(', '))}</span>`:''}<br>${st.t?`<span class="muted num" style="font-size:13px">${fint(st.t.kcal)}${st.p?' / '+fint(st.p.kcal):''} kcal · P ${fmt(st.t.p,0)} · C ${fmt(st.t.c,0)} · F ${fmt(st.t.f,0)} g</span>`:''}<span style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${statusPill(st)}${hitChips(st)}</span></span>${ICON.fwd.replace('<svg','<svg width="18" height="18"')}</button>`;
  }
  h+=`</div>${n<90?`<button class="btn block" data-act="moreDays">Show ${n<30?30:90} days</button>`:''}`;
  return h;
}

/* ---------- Saved meals ---------- */
function itemsTotals(items,mult){const t={kcal:0,p:0,c:0,f:0,fib:0};for(const i of items){if(i.on===false)continue;const m=(i.g||0)*(mult||1)/100;t.kcal+=i.per.kcal*m;t.p+=i.per.p*m;t.c+=i.per.c*m;t.f+=i.per.f*m;t.fib+=(i.per.fib||0)*m;}return t;}
function itemFromEntry(e){return {fid:e.fid||null,n:e.n,g:e.g,mode:e.mode==='s'&&e.sg>0?'s':'g',per:clone(e.per),sl:e.sl||null,sg:e.sg||null};}
function itemFromFood(f,g,mode){return {fid:f.id||null,n:f.n,g:Math.round(g*10)/10,mode:mode==='s'&&f.sg>0?'s':'g',per:{kcal:f.kcal,p:f.p,c:f.c,f:f.f,fib:f.fib||0},sl:f.sl||null,sg:f.sg||null};}
function entryFromItem(i,g,meal){g=Math.round(g*10)/10;const q=i.sg>0?g/i.sg:0;const sv=i.mode==='s'&&i.sg>0&&Math.abs(q*4-Math.round(q*4))<0.02;return {id:rid(),fid:i.fid||null,n:i.n,meal,mode:sv?'s':'g',amt:sv?Math.round(g/i.sg*100)/100:g,g,per:clone(i.per),sl:i.sl||null,sg:i.sg||null};}
function itemAmt(i,g){return i.mode==='s'&&i.sg>0?`${fmt(g/i.sg,2)} × ${i.sl} (${fmt(g,0)} g)`:`${fmt(g,0)} g`;}
function macroLine(t){return `${fint(t.kcal)} kcal · P ${fmt(t.p,0)} · C ${fmt(t.c,0)} · F ${fmt(t.f,0)}`;}
function tiles(t){return `<div><b>${fint(t.kcal)}</b><span>kcal</span></div><div><b style="color:var(--pro)">${fmt(t.p,1)}</b><span>protein</span></div><div><b style="color:var(--carb)">${fmt(t.c,1)}</b><span>carbs</span></div><div><b style="color:var(--fat)">${fmt(t.f,1)}</b><span>fat</span></div>`;}
function mealsList(){
  const list=S.meals||[];
  let h=`<button class="btn primary block" data-act="mealNew">+ Create a meal</button>`;
  if(!list.length)return h+`<div class="empty" style="margin-top:12px"><h3>Save foods you eat together</h3><p>Build a meal here, or tap <b>Save as meal</b> under any meal in your diary. Next time you can add everything in one go.</p></div>`;
  return h+`<div class="list" style="margin-top:8px">${list.map(m=>{const t=itemsTotals(m.items,1),names=m.items.map(i=>i.n).join(', ');return `<div class="li"><button class="grow" style="text-align:left;min-width:0" data-act="mealOpen" data-id="${m.id}"><b>${esc(m.n)}</b><small class="num">${m.items.length} item${m.items.length===1?'':'s'} · ${macroLine(t)}</small><small class="ell">${esc(names)}</small></button><button class="btn sm" data-act="mealEdit" data-id="${m.id}">Edit</button></div>`;}).join('')}</div>`;
}

function readBackup(file){

/* ============================== BARCODE SCANNING ==============================
   Camera + decoder: the browser's BarcodeDetector where it exists (Chrome on Android), otherwise the open-source
   ZXing reader loaded on demand (iPhone). Product data: Open Food Facts. Not available inside Claude, where the
   camera and outside sites are blocked. */
const canScan=!window.claude&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
const ZX_URLS=['https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js','https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js'];
let scan=null,decoderP=null;
const loadScript=src=>new Promise((ok,no)=>{const el=document.createElement('script');el.src=src;el.onload=ok;el.onerror=()=>{el.remove();no();};document.head.appendChild(el);});
async function makeDecoder(){
  if('BarcodeDetector' in window){try{const f=(await BarcodeDetector.getSupportedFormats()).filter(x=>['ean_13','ean_8','upc_a','upc_e'].includes(x));if(f.length){const d=new BarcodeDetector({formats:f});return async c=>{const r=await d.detect(c);return r[0]?r[0].rawValue:null;};}}catch(e){}}
  for(const u of ZX_URLS){if(window.ZXing)break;try{await loadScript(u);}catch(e){}}
  const Z=window.ZXing;if(!Z||!Z.MultiFormatReader||!Z.HTMLCanvasElementLuminanceSource)throw new Error('nolib');
  const reader=new Z.MultiFormatReader(),B=Z.BarcodeFormat;
  reader.setHints(new Map([[Z.DecodeHintType.POSSIBLE_FORMATS,[B.EAN_13,B.EAN_8,B.UPC_A,B.UPC_E]],[Z.DecodeHintType.TRY_HARDER,true]]));
  return c=>{try{return reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)))).getText();}catch(e){return null;}};
}
function stopScan(){if(!scan)return;scan.alive=false;clearTimeout(scan.timer);if(scan.stream)scan.stream.getTracks().forEach(t=>t.stop());scan=null;const v=$('#scanVid');if(v)v.srcObject=null;}
async function startScan(){
  const v=$('#scanVid'),msg=$('#scanMsg');if(!v)return;
  stopScan();const me={alive:true};scan=me;
  try{
    me.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
    if(!me.alive){me.stream.getTracks().forEach(t=>t.stop());return;}
    v.srcObject=me.stream;await v.play();
    const decode=await (decoderP=decoderP||makeDecoder().catch(e=>{decoderP=null;throw e;}));
    if(!me.alive)return;
    msg.textContent='Hold the barcode inside the box';
    const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});
    const tick=async()=>{
      if(!me.alive)return;
      if(v.videoWidth){c.width=Math.min(960,v.videoWidth);c.height=Math.round(v.videoHeight*c.width/v.videoWidth);ctx.drawImage(v,0,0,c.width,c.height);
        const code=await decode(c);
        if(me.alive&&code&&/^\d{8,14}$/.test(code)){stopScan();try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}lookupBarcode(code);return;}}
      me.timer=setTimeout(tick,150);
    };
    tick();
  }catch(e){
    if(!me.alive)return;stopScan();
    msg.textContent=e&&(e.name==='NotAllowedError'||e.name==='SecurityError')?'Camera access is blocked. Allow the camera for this app in your phone settings, or type the number below.':e&&e.message==='nolib'?'Scanning needs an internet connection the first time. Check your connection, or type the number below.':'The camera couldn’t start. Type the barcode number below instead.';
  }
}
document.addEventListener('visibilitychange',()=>{if(ui.sheet&&ui.sheet.type==='scan'&&!ui.sheet.state){if(document.hidden)stopScan();else startScan();}});
function shScan(){
  const s=ui.sheet;
  const body=s.state==='busy'?`<div class="card"><p>Looking up ${esc(s.code)}…</p></div>`
    :s.state==='err'?`<div class="card"><p>Couldn’t reach the food database. Check your internet connection and try again.</p><div class="row" style="margin-top:10px"><button class="btn sm primary" data-act="scanRetry">Try again</button><button class="btn sm" data-act="scanAgain">Scan again</button></div></div>`
    :`<div class="scanbox"><video id="scanVid" playsinline muted autoplay></video><i></i></div><p class="muted" id="scanMsg" style="font-size:14px;text-align:center">Starting the camera…</p>`;
  return `<div class="sh-h"><div class="grab"></div><div class="row between"><h3>Scan a barcode</h3><button class="btn sm" data-act="backToFood">Back</button></div></div>
  <div class="sh-b stack">${body}
  <div class="field"><label for="bcIn">Or type the barcode number</label><div class="row"><input class="inp num grow" id="bcIn" inputmode="numeric" maxlength="14" placeholder="e.g. 5000159407236" value="${esc(s.typed||'')}"><button class="btn primary" data-act="bcLookup">Look up</button></div></div>
  <p class="foot">Product details come from Open Food Facts, a free database anyone can add to. Always check the values against the packet.</p></div>`;
}
function offFood(p){
  const n=p.nutriments||{},num=k=>{const v=n[k]===''||n[k]==null?NaN:Number(n[k]);return isFinite(v)&&v>=0?Math.round(v*10)/10:null;};
  let kcal=num('energy-kcal_100g');if(kcal==null){const kj=num('energy-kj_100g')??num('energy_100g');if(kj!=null)kcal=Math.round(kj/4.184);}
  const name=String(p.product_name||p.product_name_en||'').trim(),brand=String(p.brands||'').split(',')[0].trim();
  const f={n:((brand&&!norm(name).includes(norm(brand))?brand+' ':'')+name).trim().slice(0,60),kcal,p:num('proteins_100g'),c:num('carbohydrates_100g'),f:num('fat_100g'),fib:num('fiber_100g')};
  const sq=Number(p.serving_quantity),ss=String(p.serving_size||'').trim();
  if(sq>0){f.sg=Math.round(sq*10)/10;f.sl=ss&&ss.length<=24?ss:'1 serving';}
  return f;
}
async function lookupBarcode(code){
  const s=ui.sheet;if(!s)return;
  const own=(S.customFoods||[]).find(f=>f.bc===code);
  if(own){toast('Found in your foods');openQty(own,s.meal,null,s.ctx);return;}
  s.state='busy';s.code=code;renderSheet();
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}?fields=product_name,product_name_en,brands,nutriments,serving_size,serving_quantity`);
    if(!r.ok&&r.status!==404)throw new Error('http');
    const j=await r.json().catch(()=>null);
    if(ui.sheet!==s)return;
    const p=j&&j.product&&(j.status===1||j.status==='success')?j.product:null,f=p?offFood(p):{};
    const full=p&&['kcal','p','c','f'].every(k=>f[k]!=null);
    ui.sheet={type:'customFood',meal:s.meal,q:'',bc:code,prefill:f,back:s.back,
      scanNote:full?'Found it. Check the values against the packet, then save. Nutrition data from Open Food Facts.':p?'Found the product, but some nutrition values are missing. Fill them in from the label.':'This barcode isn’t in the database yet. Enter the values from the label and the app will recognise it next time you scan it.'};
    renderSheet();
  }catch(e){if(ui.sheet===s){s.state='err';renderSheet();}}
}

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600);}
function armed(el,label){if(el.dataset.armed==='1')return true;el.dataset.armed='1';const o=el.innerHTML;el.textContent=label||'Tap again to confirm';el.classList.add('armed');setTimeout(()=>{if(el.isConnected){el.dataset.armed='';el.innerHTML=o;el.classList.remove('armed');}},3000);return false;}
function startSession(w){
  if(S.active){toast('Finish or discard your current workout first.');ui.tab='train';ui.inSession=true;render();return;}
  const ex=(w?w.exercises:[]).map(t=>mkActiveEx(t.ex,t.reps,Math.max(1,Math.min(12,+t.sets||3))));
  S.active={id:rid(),wid:w?w.id:null,name:w?(w.name||'Workout'):'Workout',start:Date.now(),ex};
  ui.inSession=true;touchMain();window.scrollTo(0,0);render();
}
function finishSession(){
  const a=S.active;if(!a)return;
  const ex=a.ex.map(e=>({n:e.n,sets:e.sets.filter(s=>s.done).map(s=>e.lr?{a:s.a,b:s.b,ra:s.ra??null,rb:s.rb??null}:{a:s.a,b:s.b})})).filter(e=>e.sets.length);
  if(!ex.length){toast('Tick off at least one set, or discard the workout.');return;}
  const before={};for(const e of ex){const prev=allSessions().map(s=>s.ex.find(x=>x.n===e.n)).filter(Boolean);if(prev.length)before[e.n]=Math.max(...prev.map(x=>metric(exInfo(e.n).k,x.sets)));}
  const sess={id:a.id,wid:a.wid,name:a.name,start:a.start,end:Date.now(),ex};
  const k=todayKey(new Date(a.start));ensureDay(k).sessions.push(sess);
  const prs=[];for(const e of ex){const kk=exInfo(e.n).k;const v=metric(kk,e.sets);if(before[e.n]!=null&&v>before[e.n]+1e-6)prs.push({n:e.n,k:kk,v});}
  S.active=null;ui.inSession=false;stopRest();touchMain();touchDay(k);render();
  openSheet({type:'summary',sess,prs});
}
let rest={end:0,len:0,t:null};
function startRest(){rest.len=S.settings.rest||90;rest.end=Date.now()+rest.len*1000;clearInterval(rest.t);rest.t=setInterval(renderRest,250);renderRest();}
function stopRest(){rest.end=0;clearInterval(rest.t);renderRest();}
function renderRest(){
  const el=$('#rest');const left=rest.end-Date.now();
  if(!rest.end||!S.active||ui.tab!=='train'){el.hidden=true;if(rest.end&&left<=0)stopRestQuiet();return;}
  if(left<=0){stopRestQuiet();el.hidden=true;try{navigator.vibrate&&navigator.vibrate([180,80,180]);}catch(e){}toast('Rest over. Next set.');return;}
  el.hidden=false;
  const pct=100*left/(rest.len*1000);
  el.innerHTML=`<div class="rest-in"><span style="font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.7">Rest</span><b>${dur(left+999)}</b><span class="rest-bar"><i style="width:${pct}%"></i></span><button data-act="restAdj" data-d="-15">−15</button><button data-act="restAdj" data-d="15">+15</button><button data-act="restSkip">Skip</button></div>`;
}

function goTab(t,dir,force){

  if(t==='train'&&S.active)ui.inSession=true;

  const v=$('#view');

    v.style.transition='none';v.style.transform=`translateX(${dir*48}px)`;v.style.opacity='0';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{v.style.transition='transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s ease-out';v.style.transform='';v.style.opacity='';}));
  }else{v.style.transition='';v.style.transform='';v.style.opacity='';}
}

    const t=e.touches[0],dx=t.clientX-sw.x0,dy=t.clientY-sw.y0;
    if(!sw.lock){

  },{passive:false});
  function end(cancel){
    if(!sw.on||sw.lock!=='h'){sw.on=false;return;}
    sw.on=false;
    const dx=sw.dx,dt=Math.max(1,Date.now()-sw.t0),i=TABS.indexOf(ui.tab),ni=i+(dx<0?1:-1);

    }else reset(true);
  }
  document.addEventListener('touchend',()=>end(false),{passive:true});
  document.addEventListener('touchcancel',()=>end(true),{passive:true});
})();

render();
initCloud();

</script>
